name: Phase 6 diagnostics and sensor tests

on:
  workflow_dispatch:
  push:
    branches:
      - phase-12-pi-api-https
    paths:
      - "api/main.py"
      - "api/tests/test_api.py"
      - "api/requirements.txt"
      - "api/requirements-test.txt"
      - "thashu/hardware/gpio_control.py"
      - "thashu/tests/test_hardware_protocol.py"
      - ".github/workflows/phase6-sensor-freshness.yml"
  pull_request:
    paths:
      - "api/main.py"
      - "api/tests/test_api.py"
      - "api/requirements.txt"
      - "api/requirements-test.txt"
      - "thashu/hardware/gpio_control.py"
      - "thashu/tests/test_hardware_protocol.py"
      - ".github/workflows/phase6-sensor-freshness.yml"

jobs:
  sensor-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: python -m pip install -r api/requirements-test.txt
      - name: Test diagnostics API, protocol, and sensor freshness
        run: python -m unittest api.tests.test_api thashu.tests.test_hardware_protocol
        env:
          PYTHONPATH: thashu
