name: Pi backend diagnostics and safety tests

on:
  workflow_dispatch:
  push:
    branches:
      - phase-12-pi-api-https
    paths:
      - "api/main.py"
      - "api/config.py"
      - "api/tests/test_api.py"
      - "api/requirements.txt"
      - "api/requirements-test.txt"
      - "thashu/core/api_lifecycle.py"
      - "thashu/core/config.py"
      - "thashu/core/model_paths.py"
      - "thashu/core/robot_manager.py"
      - "thashu/hardware/gpio_control.py"
      - "thashu/tests/test_hardware_protocol.py"
      - "thashu/tests/test_robot_manager.py"
      - "thashu/tests/test_runtime_cleanup.py"
      - ".github/workflows/phase6-sensor-freshness.yml"
  pull_request:
    paths:
      - "api/main.py"
      - "api/config.py"
      - "api/tests/test_api.py"
      - "api/requirements.txt"
      - "api/requirements-test.txt"
      - "thashu/core/api_lifecycle.py"
      - "thashu/core/config.py"
      - "thashu/core/model_paths.py"
      - "thashu/core/robot_manager.py"
      - "thashu/hardware/gpio_control.py"
      - "thashu/tests/test_hardware_protocol.py"
      - "thashu/tests/test_robot_manager.py"
      - "thashu/tests/test_runtime_cleanup.py"
      - ".github/workflows/phase6-sensor-freshness.yml"

jobs:
  backend-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test and quality dependencies
        run: python -m pip install -r api/requirements-test.txt
      - name: Check backend formatting
        run: python -m ruff format --check --line-length 100 api/config.py thashu/core/config.py thashu/core/model_paths.py
      - name: Run backend static checks
        run: python -m ruff check --select E4,E7,E9,F api thashu/core/config.py thashu/core/model_paths.py thashu/core/robot_manager.py thashu/hardware/gpio_control.py thashu/tests/test_hardware_protocol.py thashu/tests/test_robot_manager.py thashu/tests/test_runtime_cleanup.py
      - name: Test API, robot manager, hardware protocol, and cleanup
        run: python -m unittest api.tests.test_api thashu.tests.test_robot_manager thashu.tests.test_hardware_protocol thashu.tests.test_runtime_cleanup
        env:
          PYTHONPATH: thashu
