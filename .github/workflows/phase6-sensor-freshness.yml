name: Pi backend diagnostics and safety tests

on:
  workflow_dispatch:
  push:
    branches:
      - phase-12-pi-api-https
    paths:
      - "api/main.py"
      - "api/tests/test_api.py"
      - "api/requirements.txt"
      - "api/requirements-test.txt"
      - "thashu/core/api_lifecycle.py"
      - "thashu/core/robot_manager.py"
      - "thashu/hardware/gpio_control.py"
      - "thashu/tests/test_api_lifecycle.py"
      - "thashu/tests/test_gpio_protocol.py"
      - "thashu/tests/test_hardware_protocol.py"
      - "thashu/tests/test_robot_manager.py"
      - ".github/workflows/phase6-sensor-freshness.yml"
  pull_request:
    paths:
      - "api/main.py"
      - "api/tests/test_api.py"
      - "api/requirements.txt"
      - "api/requirements-test.txt"
      - "thashu/core/api_lifecycle.py"
      - "thashu/core/robot_manager.py"
      - "thashu/hardware/gpio_control.py"
      - "thashu/tests/test_api_lifecycle.py"
      - "thashu/tests/test_gpio_protocol.py"
      - "thashu/tests/test_hardware_protocol.py"
      - "thashu/tests/test_robot_manager.py"
      - ".github/workflows/phase6-sensor-freshness.yml"

jobs:
  backend-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: python -m pip install -r api/requirements-test.txt
      - name: Test API, lifecycle, robot manager, and serial protocol
        run: python -m unittest api.tests.test_api thashu.tests.test_api_lifecycle thashu.tests.test_robot_manager thashu.tests.test_hardware_protocol thashu.tests.test_gpio_protocol
        env:
          PYTHONPATH: thashu
